# CDN front door for the NAS deployment.
#
# Why this exists: the Octo database hands the client a CDN url format of
# "{scheme}://{Request.Host}/cdn/{o}" (Program.cs) and every catalog entry addresses its bundle as
# "/cdn/<6-char key>". Serving that path from disk here means the client's ~1 GB of asset downloads never
# touches the API process, and - because the url format is derived from the Host the request arrived on -
# a client on the LAN and a client on the DDNS name each get working urls with no code change and no extra
# port. Registry-bound image serving stays on the API.
#
# /assets/cdn is a farm of symlinks named after each object key, built from config/resources/catalog.json
# by scripts/build-cdn-tree.py. Symlinks rather than an nginx map of 2601 entries: no generated config to
# reload, and no per-request lookup.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Bundles are ~1 GB in total and range requests are how the Unity downloader resumes, so log enough to
    # tell a CDN hit from a proxied one during verification.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Docker's embedded DNS. The API is addressed through a variable below so nginx re-resolves it: with a
    # plain proxy_pass to a service name, nginx resolves once at startup and keeps that IP forever, so
    # recreating the API container (which is what every deploy does) leaves nginx proxying to a dead address
    # until it too is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 18080;
        server_name _;

        # Assets are large; don't let a slow client tie up a worker indefinitely mid-download.
        send_timeout 300s;

        location /cdn/ {
            root /assets;
            # Matches what the API sets for the same content, so a bundle fetched from either path caches
            # identically on the device.
            add_header Cache-Control "public,max-age=31536000,immutable" always;
            add_header Accept-Ranges bytes always;
            try_files $uri =404;
        }

        # Build artifacts to sideload on a phone: client APKs. Served from /assets/dl, deliberately NOT from
        # /assets/cdn, because build-cdn-tree.py deletes and rebuilds that whole farm from the catalog on every
        # deploy - anything dropped in there disappears on the next run. No immutable caching header here: a
        # rebuild of the same file name has to be fetchable, and the APKs are not content-addressed.
        location /dl/ {
            root /assets;
            autoindex off;
            add_header Accept-Ranges bytes always;
            try_files $uri =404;
        }

        location / {
            set $api_backend kickflight-api:8080;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;

            # $http_host, not $host: the API rebuilds the CDN url format from Request.Host, which includes
            # the port. $host would strip ":18080" and the client would download from port 80.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # /health/ready probes Photon before answering and takes ~4.5 s; well inside the default, but
            # matchmaking holders can sit idle on a stream, so give them room.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }
}
