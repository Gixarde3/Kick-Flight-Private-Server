# GeoIP always uses the socket peer. Do not trust visitor-controlled forwarding headers.
geoip2 /var/lib/geoip/dbip-country.mmdb {
    auto_reload 5m;
    $geoip2_country_code default=ZZ source=$remote_addr country iso_code;
}

map $geoip2_country_code $locale {
    default en;
    ES es;
    MX es;
    AR es;
    BO es;
    CL es;
    CO es;
    CR es;
    CU es;
    DO es;
    EC es;
    SV es;
    GQ es;
    GT es;
    HN es;
    NI es;
    PA es;
    PY es;
    PE es;
    PR es;
    UY es;
    VE es;
}
