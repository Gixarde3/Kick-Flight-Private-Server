load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/geoip-runtime.conf;
    limit_req_zone $binary_remote_addr zone=diag_uploads:10m rate=2r/m;

    # Caddy runs in host network mode and forwards to the published 18080 port.
    # Trust only the Docker bridge gateway used by that local proxy so the
    # landing page's country lookup sees the visitor IP, never a client header.
    set_real_ip_from 172.18.0.1;
    real_ip_header X-Real-IP;

    server {
        listen 18080;
        server_name _;
        send_timeout 300s;

        # Diagnostic intake only: expose bounded POST uploads; keep the diagnostic UI and other routes private.
        location = /diag/upload {
            limit_except POST { deny all; }
            limit_req zone=diag_uploads burst=2 nodelay;
            limit_req_status 429;
            client_max_body_size 5m;
            set $api_backend api:8080;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
        }
        location = /diag/upload-file {
            limit_except POST { deny all; }
            limit_req zone=diag_uploads burst=2 nodelay;
            limit_req_status 429;
            client_max_body_size 210m;
            set $api_backend api:8080;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # Development-only controls and the manual upload form remain private.
        location ^~ /diag { return 404; }
        location = /gym { return 404; }
        location ^~ /gym/ { return 404; }

        # Serve the download landing page on the public root without intercepting API paths.
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        }

        # This is a local lookup against the monthly DB-IP Lite database; it never calls an API.
        location = /__locale {
            if ($locale = unavailable) { return 404; }
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 $locale;
        }

        # Static art used only by the landing page; the game CDN stays under /cdn/.
        location ^~ /assets/ {
            alias /usr/share/nginx/html/assets/;
            add_header Cache-Control "public,max-age=86400" always;
        }

        location /cdn/ {
            root /assets;
            add_header Cache-Control "public,max-age=31536000,immutable" always;
            add_header Accept-Ranges bytes always;
            try_files $uri =404;
        }

        location /dl/ {
            root /assets;
            autoindex off;
            add_header Accept-Ranges bytes always;
            try_files $uri =404;
        }

        location / {
            set $api_backend api:8080;
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
    }
}
