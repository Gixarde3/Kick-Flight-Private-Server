worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 18081;
        http2 on;
        server_name _;

        # Forward only the sole generated gRPC method. Other HTTP/2 requests cannot reach Minimal API routes
        # such as /diag on the API's h2c listener.
        location = /openmatch.Frontend/GetAssignments {
            set $api_backend api:18081;
            grpc_pass grpc://$api_backend;
            grpc_set_header Host $http_host;
        }
        location / { return 404; }
    }
}
