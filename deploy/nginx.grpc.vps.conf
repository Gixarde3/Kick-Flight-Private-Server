worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 18081;
        http2 on;
        server_name _;

        # Forward only the sole generated gRPC method. Other HTTP/2 requests cannot reach Minimal API routes
        # such as /diag on the API's h2c listener.
        location = /openmatch.Frontend/GetAssignments {
            set $api_backend api:18081;
            grpc_pass grpc://$api_backend;
            grpc_set_header Host $http_host;
            # Keep the assignment stream open for the full matchmaking window. The API sends the
            # initial human roster, then waits for the window to close before Stage 2/3; the
            # default 60 s would cancel both the client stream and pending room on longer windows.
            # This covers the 120 s VPS window, join extensions, and the Stage 2 -> Stage 3 handoff.
            grpc_read_timeout 300s;
        }
        location / { return 404; }
    }
}
