<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick-Flight Balance</title>
<style>
  :root {
    --bg: #14161c;
    --bg2: #1b1e26;
    --bg3: #22262f;
    --line: #2e3340;
    --fg: #e6e8ee;
    --fg2: #9aa2b4;
    --accent: #4da3ff;
    --dirty: #ffb347;
    --ok: #58d68d;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header#top {
    display: flex; align-items: baseline; gap: 12px;
    padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  header#top h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header#top .hint { color: var(--fg2); font-size: 12px; }
  #layout {
    display: flex; align-items: stretch;
    height: calc(100vh - 41px - 6.5rem);
  }
  #sidebar {
    width: 320px; min-width: 320px; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: var(--bg2);
  }
  #tabs { display: flex; gap: 6px; padding: 10px; }
  #tabs button {
    flex: 1; padding: 7px 10px; border: 1px solid var(--line); background: var(--bg3);
    color: var(--fg2); border-radius: 6px; cursor: pointer; font: inherit;
  }
  #tabs button.on { background: var(--accent); border-color: var(--accent); color: #06131f; font-weight: 600; }
  #filters { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  input[type=text], select {
    width: 100%; padding: 6px 8px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; font: inherit;
  }
  #list { list-style: none; margin: 0; padding: 0 10px 16px; overflow-y: auto; flex: 1; }
  #list li.item {
    display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; border: 1px solid transparent;
  }
  #list li.item:hover { background: var(--bg3); }
  #list li.item.sel { background: #1f3550; border-color: var(--accent); }
  #list img.icon, #list .icon.ph {
    width: 48px; height: 48px; flex: 0 0 48px; border-radius: 5px; background: var(--bg3);
    object-fit: cover;
  }
  #list .meta { min-width: 0; }
  #list .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .sub { color: var(--fg2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .count { color: var(--fg2); font-size: 11px; padding: 4px 8px; }
  #panel { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }
  #panel > .empty { color: var(--fg2); }
  .phead { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .phead img, .phead .icon.ph {
    width: 72px; height: 72px; flex: 0 0 72px; border-radius: 7px; background: var(--bg3);
    object-fit: cover;
  }
  .phead h1 { margin: 0; font-size: 19px; }
  .phead .meta { color: var(--fg2); font-size: 12px; }
  section.sec {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  section.sec.nested { background: var(--bg3); margin-bottom: 10px; }
  section.sec h2 {
    margin: 0 0 8px; font-size: 13px; font-weight: 600;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  section.sec h2 code {
    font-size: 11px; color: var(--fg2); background: var(--bg); padding: 1px 6px;
    border-radius: 4px; border: 1px solid var(--line);
  }
  .note { color: var(--fg2); margin: 4px 0; }
  .row { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .row:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .rowhead { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
  .chip {
    font-size: 11px; color: var(--fg2); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 1px 8px;
  }
  .chip b { color: var(--fg); font-weight: 600; }
  .chip.ovr { color: var(--dirty); border-color: var(--dirty); }
  button.mini.rev { border-color: var(--dirty); color: var(--dirty); }
  #applyStatus:empty { display: none; }
  #applyStatus { margin-top: 6px; }
  #applyStatus .line { font: 11px/1.5 ui-monospace, Consolas, monospace; }
  #applyStatus .line.ok { color: var(--ok); }
  #applyStatus .line.err { color: var(--err); }
  #applyStatus .line.info { color: var(--fg2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 10px; }
  label.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  label.field > .k { font-size: 11px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  label.field input[type=number] {
    width: 100%; padding: 4px 6px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; font: 12px/1.4 ui-monospace, Consolas, monospace;
  }
  label.field input[type=number]:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  label.field input[type=number].dirty { border-color: var(--dirty); background: #2b2415; color: #ffd79a; }
  label.field input[type=number].invalid { border-color: var(--err); }
  label.field input[type=checkbox] { width: 15px; height: 15px; margin: 2px 0; accent-color: var(--accent); }
  label.field input[type=checkbox].dirty { outline: 2px solid var(--dirty); }
  label.field.readonly .ro {
    font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--fg2);
    padding: 4px 6px; background: #191c23; border: 1px dashed var(--line); border-radius: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  label.field.readonly .ro.wrap { white-space: normal; }
  footer#foot {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg2);
    border-top: 1px solid var(--line); padding: 8px 16px; z-index: 5;
  }
  footer#foot .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  footer#foot #dirtyCount { font-weight: 600; }
  footer#foot #dirtyCount.has { color: var(--dirty); }
  footer#foot button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg3); color: var(--fg); font: inherit; cursor: pointer;
  }
  footer#foot button#save { background: var(--accent); border-color: var(--accent); color: #06131f; font-weight: 600; }
  footer#foot button:disabled { opacity: .45; cursor: default; }
  footer#foot .note { font-size: 11px; }
  #saveStatus { max-height: 6rem; overflow-y: auto; margin-top: 6px; }
  #saveStatus:empty { display: none; }
  #saveStatus .line { font: 11px/1.5 ui-monospace, Consolas, monospace; }
  #saveStatus .line.ok { color: var(--ok); }
  #saveStatus .line.err { color: var(--err); }
  #saveStatus .line.info { color: var(--fg2); }
  code { font-family: ui-monospace, Consolas, monospace; }
  /* Text tab: wireframe of a UI prefab (1080x1920 canvas at 1/3) */
  .wire { position: relative; width: 360px; height: 640px; background: #0b1017; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; margin: 8px 0 14px; flex: 0 0 auto; }
  .wire .box { position: absolute; box-sizing: border-box; border: 1px solid rgba(96,165,250,.55);
    background: rgba(96,165,250,.10); color: #e8edf5; overflow: hidden; white-space: nowrap; line-height: 1.1;
    padding: 0 2px; cursor: pointer; text-overflow: ellipsis; }
  .wire .box.off { border-style: dashed; opacity: .55; }
  .wire .box.hot { border-color: var(--dirty); background: rgba(250,204,21,.18); }
  .wire .box.empty { border-color: rgba(248,113,113,.7); background: rgba(248,113,113,.12); }
  .wire .box.cur { outline: 2px solid var(--accent); z-index: 2; }
  .textwrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .textrows { flex: 1 1 420px; min-width: 320px; }
  .trow { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 8px; align-items: center;
    padding: 6px 0; border-bottom: 1px solid var(--line); }
  .trow .kk { font: 12px ui-monospace, Consolas, monospace; color: var(--fg2); word-break: break-all; }
  .trow .pp { font-size: 10px; color: var(--fg2); opacity: .7; word-break: break-all; }
  .trow input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg3); color: var(--fg); font: inherit; }
  .trow input[type=text].dirty { border-color: var(--dirty); }
  .trow .missing { color: var(--err); font-size: 12px; }
  .legend { font-size: 11px; color: var(--fg2); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(96,165,250,.55); background: rgba(96,165,250,.10); margin: 0 4px 0 8px; vertical-align: middle; }
  .legend i.empty { border-color: rgba(248,113,113,.7); background: rgba(248,113,113,.12); }
  .legend i.off { border-style: dashed; }
  /* Effect rows: add / delete */
  section.sec h2 .grow { flex: 1; }
  button.mini {
    padding: 2px 9px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--bg3); color: var(--fg); font: 11px inherit; cursor: pointer;
  }
  button.mini.add { border-color: var(--ok); color: var(--ok); }
  button.mini.del { border-color: var(--err); color: var(--err); }
  button.mini:hover { background: var(--bg); }
  button.mini:disabled { opacity: .5; cursor: default; }
  .rowhead .spacer { flex: 1; }
  /* Maintenance panel */
  .mpanel { max-width: 760px; }
  .mstate { display: inline-block; padding: 2px 10px; border-radius: 10px; font-weight: 600; border: 1px solid var(--line); }
  .mstate.mode-off { color: var(--ok); border-color: var(--ok); }
  .mstate.mode-warning { color: var(--dirty); border-color: var(--dirty); }
  .mstate.mode-hard { color: var(--err); border-color: var(--err); }
  .mbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .mbtns button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg3); color: var(--fg); font: inherit; cursor: pointer; }
  .mbtns button.m-off { border-color: var(--ok); }
  .mbtns button.m-warning { border-color: var(--dirty); }
  .mbtns button.m-hard { border-color: var(--err); }
  .mbtns button:disabled { opacity: .5; cursor: default; }
  .mfield { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
  .mfield .k { font-size: 11px; color: var(--fg2); }
  .mfield input, .mfield textarea { padding: 6px 8px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: inherit; }
  .mfield textarea { min-height: 60px; resize: vertical; }
  #maintStatus:empty { display: none; }
  #maintStatus .line { font: 11px/1.5 ui-monospace, Consolas, monospace; }
  #maintStatus .line.ok { color: var(--ok); }
  #maintStatus .line.err { color: var(--err); }
  #maintStatus .line.info { color: var(--fg2); }
</style>
</head>
<body>
<header id="top">
  <h1>Kick-Flight Balance</h1>
  <span class="hint">saves write <code>.local/masters-overrides</code> (never <code>config/</code>) &mdash; restart the API to load them</span>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="tabs">
      <button type="button" data-tab="kickers" class="on">Kickers</button>
      <button type="button" data-tab="discs">Discs</button>
      <button type="button" data-tab="text">Text</button>
      <button type="button" data-tab="maintenance">Maintenance</button>
    </div>
    <div id="filters">
      <input type="text" id="filterText" placeholder="Filter by name or id" autocomplete="off">
      <div id="discFilters" style="display:none">
        <select id="filterRarity" style="margin-bottom:6px"></select>
        <select id="filterType"></select>
      </div>
    </div>
    <ul id="list"></ul>
  </aside>
  <main id="panel"><p class="empty">Loading&hellip;</p></main>
</div>

<footer id="foot">
  <div class="bar">
    <span id="dirtyCount">Unsaved changes: 0</span>
    <button type="button" id="save" disabled>Save</button>
    <button type="button" id="revert">Revert</button>
    <button type="button" id="apply">Restart API to apply</button>
    <button type="button" id="exportOverrides">Export overrides</button>
    <span class="note">saves write the override dir; restart the API to load them</span>
  </div>
  <div id="applyStatus"></div>
  <div id="saveStatus"></div>
</footer>

<script>
"use strict";

/* ------------------------------------------------------------------ config */

const CORE_TABLES = [
  "kicker", "kicker_parameter", "kicker_ability", "kicker_ability_condition",
  "skill", "special_skill", "disc", "weapon_attack"
];
/* Only files that exist under config/ are listed, so the tool never requests a
   404: masters_skill_blow_off / _pull_in exist but are empty arrays today. */
const KS_EXTRA_TABLES = [
  "skill_condition", "skill_trap", "skill_heal", "skill_blow_off",
  "skill_pull_in", "skill_collision", "skill_hit"
];
const SS_EXTRA_TABLES = [
  "special_skill_condition", "special_skill_trap", "special_skill_hit",
  "special_skill_collision", "special_skill_bullet", "special_skill_blow_off"
];
const WEAPON_EXTRA_TABLES = [
  "weapon_attack_hit", "weapon_attack_collision", "weapon_attack_bullet",
  "weapon_attack_condition"
];
const TEXT_TABLES = ["translation"];   /* masters_translation.json: key -> UI text (Text tab) */
const ALL_TABLES = CORE_TABLES.concat(KS_EXTRA_TABLES, SS_EXTRA_TABLES, WEAPON_EXTRA_TABLES, TEXT_TABLES);
const OTHER_SCREEN = "(keys used from code / enums)";
const WIRE_SCALE = 1 / 3;   /* 1080x1920 canvas -> 360x640 wireframe */

/* Row-link columns: they say which kicker/skill/attack a row belongs to, so the
   UI shows them as read-only chips instead of editing them. */
const LINK_FIELDS = new Set([
  "id", "kickerId", "attackCount", "skillId", "specialSkillId",
  "kickerAbilityId", "discId", "battleRuleId"
]);

/* Extra read-only columns per table (everything else numeric is editable). */
const READONLY_FIELDS = {
  skill: new Set([
    "description", "skillType", "skillActionType", "skillCategoryType",
    "targetAreaType", "summonId", "attributeType", "seId"
  ]),
  kicker_parameter: new Set(["roleType", "weaponType", "skillId"]),
  disc: new Set([
    "name", "rarityType", "discType", "sortOrder", "rank", "hpGrowGroupId",
    "attackGrowGroupId", "coefficientGrowGroupId", "coolTimeGrowGroupId",
    "releaseDatetime"
  ])
};

const RARITY_LABELS = { "0": "N", "1": "R", "2": "SR", "3": "UR" };

/* ------------------------------------------------------------------- state */

const state = {
  tab: "kickers",
  selection: { kickers: null, discs: null, text: null },
  layout: [],     /* docs/localize_layout.json rows: {key, screen, path, x, y, w, h, font} */
  screens: [],    /* [{name, rows, keys}] built from layout + translation keys not placed in any prefab */
  kickers: [],
  discs: [],
  data: {},       /* table name -> rows (working copy) or null when unreadable */
  pristine: {},   /* table name -> deep copy as loaded, for dirty detection */
  effectSchema: {}, /* table name -> {fields, defaults} from /api/effect-schema (add/delete allowed) */
  tables: {},      /* table name -> {overridden, source, ...} from /api/tables */
  apply: null,     /* last /api/apply status (pending overrides + health) */
  applying: false,
  maintenance: null, /* last /admin/maintenance status snapshot */
  savingMaintenance: false,
  inputs: new Map(),   /* "table|rowId|field" -> input element */
  dirtyFields: new Set(),
  dirtyTables: new Set(),
  saving: false
};

/* ------------------------------------------------------------------- utils */

function el(tag, attrs, text) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      if (key === "class") node.className = attrs[key];
      else if (key === "style") node.setAttribute("style", attrs[key]);
      else node.setAttribute(key, attrs[key]);
    }
  }
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function fieldKey(table, rowId, field) {
  return table + "|" + rowId + "|" + field;
}

function sameValue(a, b) {
  if (typeof a !== typeof b) return false;
  if (typeof a === "number") return a === b || (Number.isNaN(a) && Number.isNaN(b));
  if (a === null || typeof a !== "object") return a === b;
  return JSON.stringify(a) === JSON.stringify(b);
}

function formatValue(value) {
  if (value === null) return "null";
  if (typeof value === "boolean") return value ? "true" : "false";
  return String(value);
}

function rowsOf(table) {
  const rows = state.data[table];
  return Array.isArray(rows) ? rows : [];
}

/* Editable when it is a number/bool column that is not a link or a documented
   read-only column; strings and any structured value stay read-only. */
function fieldMode(table, key, value) {
  if (table === "translation") return key === "text" ? "text" : "readonly";
  if (LINK_FIELDS.has(key)) return "readonly";
  const readonly = READONLY_FIELDS[table];
  if (readonly && readonly.has(key)) return "readonly";
  if (typeof value === "boolean") return /^special_skill_/.test(table) ? "bool" : "readonly";
  if (typeof value === "number") return "number";
  return "readonly";
}

async function fetchJSON(url, options) {
  const response = await fetch(url, options);
  const text = await response.text();
  let body = null;
  if (text) {
    try { body = JSON.parse(text); } catch (error) { body = null; }
  }
  if (!response.ok) {
    const message = (body && body.error) || ("HTTP " + response.status);
    const failure = new Error(message);
    failure.status = response.status;
    throw failure;
  }
  return body;
}

/* --------------------------------------------------------------- data load */

async function loadTable(name, force) {
  if (!force && name in state.data) return;
  try {
    const rows = await fetchJSON("/api/table/" + name, { cache: "no-store" });
    if (!Array.isArray(rows)) throw new Error("not an array");
    state.data[name] = rows;
    state.pristine[name] = JSON.parse(JSON.stringify(rows));
  } catch (error) {
    state.data[name] = null;
    state.pristine[name] = null;
  }
}

async function loadEverything(force) {
  const names = Array.from(new Set(ALL_TABLES));
  await Promise.all(names.map(function (name) { return loadTable(name, force); }));
}

/* Which tables have an override file (masters:override layer) and the pending/health state. */
function tableInfo(table) {
  return state.tables[table] || null;
}

function isOverridden(table) {
  const info = tableInfo(table);
  return !!(info && info.overridden);
}

async function loadOverrides() {
  try {
    const tables = await fetchJSON("/api/tables", { cache: "no-store" });
    const map = {};
    for (const entry of (Array.isArray(tables) ? tables : [])) map[entry.name] = entry;
    state.tables = map;
  } catch (error) {
    state.tables = {};
  }
}

function renderApplyStatus() {
  const box = document.getElementById("applyStatus");
  if (!box) return;
  clear(box);
  const apply = state.apply;
  if (!apply) {
    box.appendChild(el("div", { class: "line info" }, "apply status unknown"));
    return;
  }
  if (apply.error) {
    box.appendChild(el("div", { class: "line err" }, "apply status: " + apply.error));
    return;
  }
  const pending = apply.pending || [];
  box.appendChild(el("div", { class: "line " + (pending.length ? "info" : "ok") }, pending.length
    ? "pending changes not yet applied: " + pending.join(", ") + " (override files newer than the API container start)"
    : "no pending changes: the API has loaded every override"));
  if (apply.note) box.appendChild(el("div", { class: "line info" }, apply.note));
  const health = apply.health || {};
  box.appendChild(el("div", { class: "line " + (health.ok ? "ok" : "err") },
    "health: " + (health.ok ? "ready" : "not ready") + (health.detail ? " - " + health.detail : "")));

  const applyButton = document.getElementById("apply");
  if (applyButton) {
    applyButton.textContent = state.applying
      ? "Restarting..."
      : (pending.length ? "Restart API to apply (" + pending.length + ")" : "Restart API to apply");
    applyButton.disabled = state.applying;
  }
  const exportButton = document.getElementById("exportOverrides");
  if (exportButton) {
    const overrides = apply.overrides || [];
    exportButton.textContent = overrides.length ? "Export overrides (" + overrides.length + ")" : "Export overrides";
    exportButton.disabled = overrides.length === 0;
  }
}

async function loadApplyStatus() {
  try {
    state.apply = await fetchJSON("/api/apply", { cache: "no-store" });
  } catch (error) {
    state.apply = { error: error.message };
  }
  renderApplyStatus();
}

/* ----------------------------------------------------------------- sidebar */

function buildDiscFilters() {
  const rarity = document.getElementById("filterRarity");
  clear(rarity);
  rarity.appendChild(el("option", { value: "" }, "All rarities"));
  const rarities = Array.from(new Set(state.discs.map(function (d) { return d.rarityType; })))
    .filter(function (r) { return r !== null && r !== undefined; })
    .sort(function (a, b) { return b - a; });
  for (const value of rarities) {
    const label = RARITY_LABELS[String(value)] || String(value);
    rarity.appendChild(el("option", { value: String(value) }, label + " (" + value + ")"));
  }

  const type = document.getElementById("filterType");
  clear(type);
  type.appendChild(el("option", { value: "" }, "All types"));
  const types = Array.from(new Set(state.discs.map(function (d) { return d.type; })))
    .filter(Boolean).sort();
  for (const value of types) type.appendChild(el("option", { value: value }, value));
}

function filteredItems() {
  const text = document.getElementById("filterText").value.trim().toLowerCase();
  if (state.tab === "maintenance") return [];
  if (state.tab === "text") {
    return state.screens.filter(function (screen) {
      if (!text) return true;
      if (screen.name.toLowerCase().indexOf(text) !== -1) return true;
      return screen.keys.some(function (key) {
        if (key.toLowerCase().indexOf(text) !== -1) return true;
        const row = translationRow(key);
        return row && String(row.text).toLowerCase().indexOf(text) !== -1;
      });
    });
  }
  if (state.tab === "kickers") {
    return state.kickers.filter(function (kicker) {
      if (!text) return true;
      return String(kicker.id).indexOf(text) !== -1 ||
        String(kicker.name).toLowerCase().indexOf(text) !== -1;
    });
  }
  const rarity = document.getElementById("filterRarity").value;
  const type = document.getElementById("filterType").value;
  return state.discs.filter(function (disc) {
    if (rarity && String(disc.rarityType) !== rarity) return false;
    if (type && disc.type !== type) return false;
    if (!text) return true;
    return String(disc.id).indexOf(text) !== -1 ||
      String(disc.name).toLowerCase().indexOf(text) !== -1 ||
      (disc.effect || "").toLowerCase().indexOf(text) !== -1;
  });
}

function iconFor(kind, id, size) {
  const img = el("img", { class: "icon", src: "icons/" + kind + "_" + id + ".png", alt: "" });
  img.addEventListener("error", function () {
    const placeholder = el("span", { class: "icon ph" }, "?");
    placeholder.style.display = "inline-flex";
    placeholder.style.alignItems = "center";
    placeholder.style.justifyContent = "center";
    placeholder.style.color = "#9aa2b4";
    if (img.parentNode) img.parentNode.replaceChild(placeholder, img);
  });
  if (size) { img.style.width = size + "px"; img.style.height = size + "px"; img.style.flex = "0 0 " + size + "px"; }
  return img;
}

function renderList() {
  const list = document.getElementById("list");
  clear(list);
  if (state.tab === "maintenance") {
    list.appendChild(el("li", { class: "count" }, "Server maintenance mode and notice text"));
    return;
  }
  const items = filteredItems();
  if (state.tab === "text") {
    list.appendChild(el("li", { class: "count" }, items.length + " of " + state.screens.length + " screens"));
    const current = state.selection.text;
    for (const screen of items) {
      const li = el("li", { class: "item", "data-id": screen.name });
      const meta = el("div", { class: "meta" });
      meta.appendChild(el("div", { class: "nm" }, screen.name));
      const missing = screen.keys.filter(function (key) { return !translationRow(key); }).length;
      meta.appendChild(el("div", { class: "sub" }, screen.keys.length + " texts" + (missing ? " · " + missing + " without a row" : "")));
      li.appendChild(meta);
      if (current === screen.name) li.className += " sel";
      li.addEventListener("click", function () { select("text", screen.name); });
      list.appendChild(li);
    }
    return;
  }
  list.appendChild(el("li", { class: "count" },
    items.length + " of " + (state.tab === "kickers" ? state.kickers.length : state.discs.length) + " shown"));

  const selected = state.selection[state.tab];
  for (const item of items) {
    const li = el("li", { class: "item", "data-id": String(item.id) });
    li.appendChild(iconFor(state.tab === "kickers" ? "kicker" : "disc", item.id, 48));
    const meta = el("div", { class: "meta" });
    meta.appendChild(el("div", { class: "nm" }, item.name));
    let sub;
    if (state.tab === "kickers") {
      sub = "id " + item.id + " · KS " + (item.skillId === null ? "-" : item.skillId);
    } else {
      sub = "id " + item.id + " · " + (item.rarity || (RARITY_LABELS[String(item.rarityType)] || "?")) +
        (item.type ? " · " + item.type : "");
    }
    meta.appendChild(el("div", { class: "sub" }, sub));
    li.appendChild(meta);
    if (selected === item.id) li.className += " sel";
    li.addEventListener("click", function () { select(state.tab, item.id); });
    list.appendChild(li);
  }
}

function select(tab, id) {
  state.tab = tab;
  state.selection[tab] = id;
  renderList();
  renderPanel();
}

/* ------------------------------------------------------------------- panel */

function canEditRows(table) {
  return !!(state.effectSchema && state.effectSchema[table]);
}

/* Badge + "Revert to base" shown on every section whose table has an override file. */
function appendOverrideControls(head, table) {
  if (!isOverridden(table)) return;
  head.appendChild(el("span", { class: "chip ovr" }, "override"));
  const button = el("button", { type: "button", class: "mini rev" }, "Revert to base");
  button.title = "Delete the override masters_" + table + ".json (a backup is kept) so the base config/ file applies again";
  button.addEventListener("click", function () {
    if (window.confirm("Revert masters_" + table + ".json to the base config file?\n\n" +
        "This deletes the override file (a backup is kept). The API keeps serving the tuned values until you restart it.")) {
      revertTable(table);
    }
  });
  head.appendChild(button);
}

async function revertTable(table) {
  if (state.saving) return;
  state.saving = true;
  refreshDirty();
  setStatus([["info", "reverting masters_" + table + ".json to base ..."]]);
  try {
    const body = await fetchJSON("/api/table/" + table + "/revert", { method: "POST" });
    if (!body || body.ok !== true) throw new Error("unexpected response");
    await loadTable(table, true);
    state.pristine[table] = JSON.parse(JSON.stringify(state.data[table]));
    await loadOverrides();
    await loadApplyStatus();
    buildScreens();
    renderPanel();
    setStatus([["ok", "masters_" + table + ".json reverted to the base config file"]]);
  } catch (error) {
    setStatus([["err", "revert failed: " + error.message]]);
  }
  state.saving = false;
  refreshDirty();
}

function makeSection(title, table, rows, options) {
  const opts = options || {};
  const adds = opts.addable && canEditRows(table) &&
    opts.linkField && opts.linkValue !== null && opts.linkValue !== undefined;
  const section = el("section", { class: "sec" + (opts.nested ? " nested" : "") });
  const head = el("h2");
  head.appendChild(el("span", { class: "t" }, title));
  head.appendChild(el("code", { class: "src" }, "masters_" + table + ".json"));
  head.appendChild(el("span", { class: "grow" }));
  appendOverrideControls(head, table);
  if (adds) {
    const button = el("button", { type: "button", class: "mini add" }, "+ Add row");
    button.title = "Add a row to masters_" + table + ".json for " + opts.linkField + " " + opts.linkValue;
    button.addEventListener("click", function () { addEffectRow(table, opts.linkField, opts.linkValue); });
    head.appendChild(button);
  }
  section.appendChild(head);

  if (!Array.isArray(rows)) {
    section.appendChild(el("p", { class: "note" }, "could not load this table"));
    return section;
  }
  if (!rows.length) {
    section.appendChild(el("p", { class: "note" }, opts.empty || "no rows for this selection"));
    return section;
  }
  for (const row of rows) {
    section.appendChild(renderRow(table, row, opts.deletable ? { deletable: true } : null));
  }
  return section;
}

function renderRow(table, row, options) {
  const opts = options || {};
  const wrap = el("div", { class: "row" });
  const head = el("div", { class: "rowhead" });
  for (const key of Object.keys(row)) {
    if (!LINK_FIELDS.has(key)) continue;
    const chip = el("span", { class: "chip" });
    chip.appendChild(document.createTextNode(key + " "));
    chip.appendChild(el("b", null, formatValue(row[key])));
    head.appendChild(chip);
  }
  if (opts.deletable) {
    head.appendChild(el("span", { class: "spacer" }));
    const button = el("button", { type: "button", class: "mini del" }, "Delete row");
    button.addEventListener("click", function () {
      if (window.confirm("Delete row id " + row.id + " from masters_" + table + ".json?")) {
        deleteEffectRow(table, row.id);
      }
    });
    head.appendChild(button);
  }
  if (head.childNodes.length) wrap.appendChild(head);

  const grid = el("div", { class: "grid" });
  for (const key of Object.keys(row)) {
    if (LINK_FIELDS.has(key)) continue;
    grid.appendChild(renderField(table, row, key, row[key]));
  }
  wrap.appendChild(grid);
  return wrap;
}

function renderField(table, row, key, value) {
  const mode = fieldMode(table, key, value);
  const label = el("label", { class: "field " + mode });
  label.appendChild(el("span", { class: "k" }, key));

  if (mode === "number") {
    const input = el("input", { type: "number", step: "any", value: formatValue(value) });
    input.dataset.table = table;
    input.dataset.rowId = String(row.id);
    input.dataset.field = key;
    if (typeof value === "number" && Number.isInteger(value)) input.dataset.int = "1";
    input.addEventListener("input", onFieldInput);
    state.inputs.set(fieldKey(table, row.id, key), input);
    label.appendChild(input);
    return label;
  }
  if (mode === "bool") {
    const input = el("input", { type: "checkbox" });
    input.checked = value === true;
    input.dataset.table = table;
    input.dataset.rowId = String(row.id);
    input.dataset.field = key;
    input.addEventListener("change", onFieldInput);
    state.inputs.set(fieldKey(table, row.id, key), input);
    label.appendChild(input);
    return label;
  }
  const isText = typeof value === "string" && value.length > 24;
  label.appendChild(el("span", { class: "ro" + (isText ? " wrap" : "") }, formatValue(value)));
  return label;
}

function findRow(table, rowId) {
  const rows = rowsOf(table);
  for (const row of rows) {
    if (String(row.id) === String(rowId)) return row;
  }
  return null;
}

function nextEffectId(table) {
  let maxId = 0;
  for (const row of rowsOf(table)) {
    if (typeof row.id === "number" && row.id > maxId) maxId = row.id;
  }
  return maxId + 1;   /* fresh against every row currently in the table */
}

function addEffectRow(table, linkField, linkValue) {
  const schema = state.effectSchema[table];
  if (!schema) return;
  const row = {};
  row.id = nextEffectId(table);
  row[linkField] = linkValue;
  const defaults = schema.defaults || {};
  const fields = schema.fields || {};
  for (const key of Object.keys(fields)) {
    if (key === "id" || key === linkField) continue;
    if (Object.prototype.hasOwnProperty.call(defaults, key)) {
      row[key] = defaults[key];
    } else {
      const kind = fields[key];
      row[key] = kind === "bool" ? false : kind === "str" ? "" : 0;
    }
  }
  const rows = rowsOf(table);
  rows.push(row);
  state.data[table] = rows;
  refreshDirty();
  renderPanel();
}

function deleteEffectRow(table, rowId) {
  state.data[table] = rowsOf(table).filter(function (row) { return String(row.id) !== String(rowId); });
  refreshDirty();
  renderPanel();
}

function onFieldInput(event) {
  const input = event.target;
  const table = input.dataset.table;
  const key = input.dataset.field;
  const row = findRow(table, input.dataset.rowId);
  if (!row) return;

  if (input.type === "checkbox") {
    row[key] = input.checked;
    delete input.dataset.invalid;
  } else if (input.value === "") {
    /* Kept as NaN so the field counts as changed; JSON.stringify turns it into
       null and the server rejects it with a readable message. */
    row[key] = NaN;
    input.dataset.invalid = "1";
  } else {
    const number = Number(input.value);
    row[key] = number;
    const wantsInt = input.dataset.int === "1";
    if (!Number.isFinite(number) || (wantsInt && !Number.isInteger(number))) {
      input.dataset.invalid = "1";
    } else {
      delete input.dataset.invalid;
    }
  }
  refreshDirty();
}

function renderPanel() {
  const panel = document.getElementById("panel");
  state.inputs.clear();
  clear(panel);
  if (state.tab === "maintenance") {
    renderMaintenancePanel(panel);
    return;
  }
  if (state.tab === "text") {
    const name = state.selection.text;
    const screen = state.screens.filter(function (sc) { return sc.name === name; })[0];
    if (!screen) {
      panel.appendChild(el("p", { class: "empty" }, "Select a screen from the list. Boxes are the LocalizeText elements of that " +
        "UI prefab (approximate: layout groups and scroll lists are not simulated); edit the text on the right and it updates live."));
      return;
    }
    renderTextPanel(panel, screen);
    return;
  }
  if (state.tab === "kickers") {
    const id = state.selection.kickers;
    if (id === null) {
      panel.appendChild(el("p", { class: "empty" }, "Select a kicker from the list."));
      return;
    }
    const kicker = state.kickers.filter(function (k) { return k.id === id; })[0];
    if (kicker) renderKickerPanel(panel, kicker);
    return;
  }
  const id = state.selection.discs;
  if (id === null) {
    panel.appendChild(el("p", { class: "empty" }, "Select a disc from the list."));
    return;
  }
  const disc = state.discs.filter(function (d) { return d.id === id; })[0];
  if (disc) renderDiscPanel(panel, disc);
}

function panelHeader(iconKind, id, title, meta) {
  const head = el("div", { class: "phead" });
  head.appendChild(iconFor(iconKind, id, 72));
  const box = el("div");
  box.appendChild(el("h1", null, title));
  box.appendChild(el("div", { class: "meta" }, meta));
  head.appendChild(box);
  return head;
}

function renderKickerPanel(panel, kicker) {
  const parameter = rowsOf("kicker_parameter").filter(function (r) { return r.kickerId === kicker.id; })[0];
  const role = parameter ? parameter.roleType : null;
  const weapon = parameter ? parameter.weaponType : null;
  const skillId = parameter ? parameter.skillId : null;
  panel.appendChild(panelHeader("kicker", kicker.id,
    kicker.name,
    "id " + kicker.id + " · roleType " + role + " · weaponType " + weapon + " · KS skillId " + skillId));

  /* Stats */
  panel.appendChild(makeSection("Stats", "kicker_parameter",
    rowsOf("kicker_parameter").filter(function (r) { return r.kickerId === kicker.id; }),
    { empty: "no kicker_parameter row for this kicker" }));

  /* Passive */
  const abilities = rowsOf("kicker_ability").filter(function (r) { return r.kickerId === kicker.id; });
  panel.appendChild(makeSection("Passive", "kicker_ability", abilities,
    { empty: "no kicker_ability row for this kicker" }));
  const abilityIds = abilities.map(function (r) { return r.id; });
  const abilityConditions = rowsOf("kicker_ability_condition").filter(function (r) {
    return abilityIds.indexOf(r.kickerAbilityId) !== -1;
  });
  if (abilityConditions.length) {
    panel.appendChild(makeSection("Passive condition", "kicker_ability_condition", abilityConditions));
  }
  /* A passive whose `value` is a skill id (Jay's bat bomb: BatAbilityParameter reads value as the trap skill,
     40001) gets that skill and its extra rows too - that is where the blast radius / fuse / lifetime / effect
     (skill_trap: radius, duration, interval, effectPath) and the damage coefficient (skill.coefficient) live. */
  for (const ability of abilities) {
    const passiveSkillId = Number.isInteger(ability.value) && ability.value >= 10000 ? ability.value : null;
    const passiveSkill = passiveSkillId === null ? [] :
      rowsOf("skill").filter(function (r) { return r.id === passiveSkillId; });
    if (!passiveSkill.length) continue;
    panel.appendChild(makeSection("Passive skill · " + passiveSkillId, "skill", passiveSkill));
    for (const table of KS_EXTRA_TABLES) {
      const rows = rowsOf(table).filter(function (r) { return r.skillId === passiveSkillId; });
      panel.appendChild(makeSection("Passive skill extra · " + table, table, rows, {
        addable: true, deletable: true, linkField: "skillId", linkValue: passiveSkillId,
        empty: "no " + table + " rows for skillId " + passiveSkillId
      }));
    }
  }

  /* Kicker skill + its extra rows */
  const skillRows = skillId === null ? [] :
    rowsOf("skill").filter(function (r) { return r.id === skillId; });
  panel.appendChild(makeSection("Kicker Skill", "skill", skillRows,
    { empty: "no masters_skill row for skillId " + skillId }));
  for (const table of KS_EXTRA_TABLES) {
    const rows = rowsOf(table).filter(function (r) { return r.skillId === skillId; });
    panel.appendChild(makeSection("Kicker Skill extra · " + table, table, rows, {
      addable: true, deletable: true, linkField: "skillId", linkValue: skillId,
      empty: "no " + table + " rows for this kicker skill"
    }));
  }

  /* Special skill + extras */
  const specials = rowsOf("special_skill").filter(function (r) { return r.kickerId === kicker.id; });
  panel.appendChild(makeSection("Special Skill", "special_skill", specials,
    { empty: "no special_skill row for this kicker" }));
  for (const table of SS_EXTRA_TABLES) {
    const rows = rowsOf(table).filter(function (r) { return r.specialSkillId === kicker.id; });
    if (rows.length) panel.appendChild(makeSection("Special Skill extra · " + table, table, rows));
  }

  /* Basic attack, grouped by attackCount */
  const attacks = rowsOf("weapon_attack")
    .filter(function (r) { return r.kickerId === kicker.id; })
    .sort(function (a, b) { return a.attackCount - b.attackCount; });
  const attackSection = el("section", { class: "sec" });
  const attackHead = el("h2");
  attackHead.appendChild(el("span", { class: "t" }, "Basic Attack"));
  attackHead.appendChild(el("code", { class: "src" }, "masters_weapon_attack.json"));
  attackHead.appendChild(el("span", { class: "grow" }));
  appendOverrideControls(attackHead, "weapon_attack");
  attackSection.appendChild(attackHead);
  if (!attacks.length) {
    attackSection.appendChild(el("p", { class: "note" }, "no weapon_attack rows for this kicker"));
  }
  for (const attack of attacks) {
    const group = el("div", { class: "row" });
    group.appendChild(makeSection("attackCount " + attack.attackCount, "weapon_attack", [attack], { nested: true }));
    for (const table of WEAPON_EXTRA_TABLES) {
      const rows = rowsOf(table).filter(function (r) {
        return r.kickerId === kicker.id && r.attackCount === attack.attackCount;
      });
      if (rows.length) {
        group.appendChild(makeSection(table, table, rows, { nested: true }));
      }
    }
    attackSection.appendChild(group);
  }
  panel.appendChild(attackSection);
}

function renderDiscPanel(panel, disc) {
  panel.appendChild(panelHeader("disc", disc.id,
    disc.name,
    "id " + disc.id + " · " + (disc.rarity || RARITY_LABELS[String(disc.rarityType)] || "?") +
    " (rarityType " + disc.rarityType + ") · discType " + disc.discType +
    " · " + (disc.type || "type ?") + " · " + (disc.attribute || "attribute ?") +
    " · skillId " + disc.skillId));

  const effect = el("section", { class: "sec" });
  const effectHead = el("h2");
  effectHead.appendChild(el("span", { class: "t" }, "Card text"));
  effectHead.appendChild(el("code", { class: "src" }, "docs/disc_cards.json"));
  effect.appendChild(effectHead);
  effect.appendChild(el("p", { class: "note" }, disc.effect || "no card entry in docs/disc_cards.json"));
  panel.appendChild(effect);

  panel.appendChild(makeSection("Disc", "disc",
    rowsOf("disc").filter(function (r) { return r.id === disc.id; }),
    { empty: "no masters_disc row for this disc" }));

  const skillRows = rowsOf("skill").filter(function (r) { return r.id === disc.skillId; });
  panel.appendChild(makeSection("Skill", "skill", skillRows,
    { empty: "no masters_skill row for skillId " + disc.skillId }));
  for (const table of KS_EXTRA_TABLES) {
    const rows = rowsOf(table).filter(function (r) { return r.skillId === disc.skillId; });
    panel.appendChild(makeSection("Skill extra · " + table, table, rows, {
      addable: true, deletable: true, linkField: "skillId", linkValue: disc.skillId,
      empty: "no " + table + " rows for skillId " + disc.skillId
    }));
  }
}

/* -------------------------------------------------------------- text tab */

function translationRow(key) {
  const rows = rowsOf("translation");
  for (const row of rows) if (row.key === key) return row;
  return null;
}

function buildScreens() {
  const byScreen = new Map();
  for (const item of state.layout) {
    if (!byScreen.has(item.screen)) byScreen.set(item.screen, []);
    byScreen.get(item.screen).push(item);
  }
  const placed = new Set(state.layout.map(function (item) { return item.key; }));
  const screens = [];
  for (const pair of byScreen) {
    const keys = Array.from(new Set(pair[1].map(function (item) { return item.key; })));
    screens.push({ name: pair[0], rows: pair[1], keys: keys });
  }
  screens.sort(function (a, b) { return b.keys.length - a.keys.length || a.name.localeCompare(b.name); });
  const other = rowsOf("translation").map(function (row) { return row.key; })
    .filter(function (key) { return !placed.has(key); }).sort();
  screens.push({ name: OTHER_SCREEN, rows: [], keys: other });
  state.screens = screens;
}

function textFor(key) {
  const row = translationRow(key);
  return row ? String(row.text) : "";
}

function renderTextPanel(panel, screen) {
  const head = el("div", { class: "phead" });
  const box = el("div");
  box.appendChild(el("h1", null, screen.name));
  box.appendChild(el("div", { class: "meta" }, screen.name === OTHER_SCREEN
    ? "translation rows that no UI prefab references directly: enum names (skillCategoryType.*, conditionType.* ...) and texts the code looks up by key"
    : screen.keys.length + " localized texts · masters_translation.json · wireframe from docs/localize_layout.json (1/3 scale, 1080x1920 canvas)"));
  head.appendChild(box);
  panel.appendChild(head);

  const wrap = el("div", { class: "textwrap" });
  const boxesByKey = new Map();
  if (screen.rows.length) {
    const side = el("div");
    side.appendChild(el("div", { class: "legend" }, "boxes: text element" ));
    const legend = side.lastChild;
    legend.appendChild(el("i", { class: "empty" })); legend.appendChild(document.createTextNode("no translation (blank in game)"));
    legend.appendChild(el("i", { class: "off" })); legend.appendChild(document.createTextNode("outside the canvas (scroll content / layout group)"));
    const wire = el("div", { class: "wire" });
    for (const item of screen.rows) {
      const b = el("div", { class: "box", title: item.path + "\n" + item.key });
      let x = item.x * WIRE_SCALE, y = item.y * WIRE_SCALE;
      const w = Math.max(item.w * WIRE_SCALE, 6), h = Math.max(item.h * WIRE_SCALE, 6);
      let off = false;
      if (x < 0 || y < 0 || x + w > 360 || y + h > 640) {
        off = true;
        x = Math.min(Math.max(x, 0), 360 - Math.min(w, 360));
        y = Math.min(Math.max(y, 0), 640 - Math.min(h, 640));
      }
      b.style.left = x + "px"; b.style.top = y + "px"; b.style.width = w + "px"; b.style.height = h + "px";
      b.style.fontSize = Math.max(6, Math.min(item.font * WIRE_SCALE, 24)) + "px";
      const text = textFor(item.key);
      b.textContent = text || item.key;
      if (!translationRow(item.key)) b.classList.add("empty");
      if (off) b.classList.add("off");
      b.addEventListener("click", function () {
        const input = state.inputs.get(fieldKey("translation", (translationRow(item.key) || {}).id, "text"));
        if (input) { input.focus(); input.select(); input.scrollIntoView({ block: "center" }); }
      });
      wire.appendChild(b);
      if (!boxesByKey.has(item.key)) boxesByKey.set(item.key, []);
      boxesByKey.get(item.key).push(b);
    }
    side.appendChild(wire);
    wrap.appendChild(side);
  }

  const rowsBox = el("div", { class: "textrows" });
  const seen = new Set();
  const ordered = screen.rows.length ? screen.rows.map(function (r) { return r.key; }) : screen.keys;
  for (const key of ordered) {
    if (seen.has(key)) continue;
    seen.add(key);
    const trow = el("div", { class: "trow" });
    const left = el("div");
    left.appendChild(el("div", { class: "kk" }, key));
    const item = screen.rows.filter(function (r) { return r.key === key; })[0];
    if (item) left.appendChild(el("div", { class: "pp" }, item.path.replace(screen.name + "/", "")));
    trow.appendChild(left);
    const row = translationRow(key);
    if (!row) {
      trow.appendChild(el("span", { class: "missing" }, "no row in masters_translation.json (blank in game) - run scripts/generate_translations.py"));
      rowsBox.appendChild(trow);
      continue;
    }
    const input = el("input", { type: "text", value: String(row.text) });
    input.dataset.table = "translation";
    input.dataset.rowId = String(row.id);
    input.dataset.field = "text";
    input.addEventListener("input", function () {
      row.text = input.value;
      const boxes = boxesByKey.get(key) || [];
      for (const b of boxes) { b.textContent = input.value || key; b.classList.toggle("hot", input.value !== state.pristine.translation.filter(function (r) { return r.id === row.id; })[0].text); }
      refreshDirty();
    });
    input.addEventListener("focus", function () {
      for (const pair of boxesByKey) for (const b of pair[1]) b.classList.toggle("cur", pair[0] === key);
    });
    state.inputs.set(fieldKey("translation", row.id, "text"), input);
    trow.appendChild(input);
    rowsBox.appendChild(trow);
  }
  wrap.appendChild(rowsBox);
  panel.appendChild(wrap);
}

/* ---------------------------------------------------------- maintenance */

function maintStatus(lines) {
  const box = document.getElementById("maintStatus");
  if (!box) return;
  clear(box);
  for (const line of lines) box.appendChild(el("div", { class: "line " + line[0] }, line[1]));
}

async function loadMaintenance() {
  try {
    state.maintenance = await fetchJSON("/api/maintenance", { cache: "no-store" });
  } catch (error) {
    state.maintenance = { error: error.message };
  }
  return state.maintenance;
}

function renderMaintenancePanel(panel) {
  const wrap = el("div", { class: "mpanel" });
  const head = el("div", { class: "phead" });
  const box = el("div");
  box.appendChild(el("h1", null, "Maintenance"));
  box.appendChild(el("div", { class: "meta" },
    "the game server's loopback-only /admin/maintenance toggle: off / soft notice / hard 503"));
  head.appendChild(box);
  wrap.appendChild(head);

  const current = state.maintenance;
  const mode = current && typeof current.mode === "string" ? current.mode : "unknown";
  const section = el("section", { class: "sec" });
  section.appendChild(el("h2", null, "Current state"));

  if (current && current.error) {
    section.appendChild(el("p", { class: "note" }, "could not read the state: " + current.error));
  } else if (current) {
    const line = el("p", { class: "note" });
    line.appendChild(el("span", { class: "mstate mode-" + mode }, mode));
    line.appendChild(document.createTextNode(
      "  noticeId " + (current.noticeId === undefined ? "-" : current.noticeId) +
      "  changedAtUtc " + (current.changedAtUtc || "-")));
    section.appendChild(line);
  } else {
    section.appendChild(el("p", { class: "note" }, "state not loaded"));
  }

  const title = el("input", { type: "text", value: (current && current.title) || "" });
  const message = el("textarea");
  message.value = (current && current.message) || "";
  const titleField = el("label", { class: "mfield" });
  titleField.appendChild(el("span", { class: "k" }, "Notice title (blank = server default)"));
  titleField.appendChild(title);
  const messageField = el("label", { class: "mfield" });
  messageField.appendChild(el("span", { class: "k" }, "Notice message (soft mode shows it on the home screen)"));
  messageField.appendChild(message);
  section.appendChild(titleField);
  section.appendChild(messageField);

  const buttons = el("div", { class: "mbtns" });
  for (const pair of [["off", "Off"], ["warning", "Soft (notice)"], ["hard", "Hard (503)"]]) {
    const button = el("button", { type: "button", class: "m-" + pair[0] }, pair[1]);
    button.disabled = !!state.savingMaintenance;
    button.addEventListener("click", function () {
      setMaintenance(pair[0], title.value.trim(), message.value.trim());
    });
    buttons.appendChild(button);
  }
  section.appendChild(buttons);
  wrap.appendChild(section);
  wrap.appendChild(el("div", { id: "maintStatus" }));

  const help = el("section", { class: "sec" });
  help.appendChild(el("h2", null, "How it reaches the server"));
  help.appendChild(el("p", { class: "note" },
    "The API only accepts /admin/maintenance from its own loopback, and its HTTP port is not " +
    "published. This tool runs it inside the container " +
    "(docker exec deploy-api-1 curl -sS http://127.0.0.1:8080/admin/maintenance); set " +
    "KF_BALANCE_ADMIN_URL to call the endpoint directly on a dev host."));
  help.appendChild(el("p", { class: "note" },
    "Saving a table writes masters_<table>.json under the override dir (KF_BALANCE_OVERRIDE_DIR), " +
    "never config/. Use \"Restart API to apply\" so the API reloads them; overrides survive the CI deploy."));
  wrap.appendChild(help);
  panel.appendChild(wrap);
}

async function setMaintenance(mode, title, message) {
  if (state.savingMaintenance) return;
  state.savingMaintenance = true;
  renderPanel();
  maintStatus([["info", "setting maintenance to " + mode + " ..."]]);
  let line;
  try {
    const body = { mode: mode };
    if (title) body.title = title;
    if (message) body.message = message;
    await fetchJSON("/api/maintenance", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    await loadMaintenance();
    line = ["ok", "maintenance is now " + ((state.maintenance && state.maintenance.mode) || mode)];
  } catch (error) {
    line = ["err", "failed: " + error.message];
  }
  state.savingMaintenance = false;
  renderPanel();
  maintStatus([line]);
}

/* ------------------------------------------------------------ dirty + save */

function refreshDirty() {
  state.dirtyFields.clear();
  state.dirtyTables.clear();
  for (const table of Object.keys(state.data)) {
    const rows = state.data[table];
    const pristine = state.pristine[table];
    if (!Array.isArray(rows) || !Array.isArray(pristine)) continue;
    const current = new Map(rows.map(function (row) { return [String(row.id), row]; }));
    const before = new Map(pristine.map(function (row) { return [String(row.id), row]; }));
    for (const pair of current) {
      const original = before.get(pair[0]);
      if (!original) {
        /* A row added in the UI: the server accepts it only for effect tables. */
        state.dirtyTables.add(table);
        state.dirtyFields.add(fieldKey(table, pair[0], "__row_added__"));
        continue;
      }
      for (const key of Object.keys(original)) {
        if (!(key in pair[1])) continue;
        if (sameValue(pair[1][key], original[key])) continue;
        state.dirtyFields.add(fieldKey(table, pair[0], key));
        state.dirtyTables.add(table);
      }
    }
    for (const id of before.keys()) {
      if (current.has(id)) continue;
      state.dirtyTables.add(table);
      state.dirtyFields.add(fieldKey(table, id, "__row_deleted__"));
    }
  }
  for (const pair of state.inputs) {
    const input = pair[1];
    input.classList.toggle("dirty", state.dirtyFields.has(pair[0]));
    input.classList.toggle("invalid", input.dataset.invalid === "1");
  }
  const counter = document.getElementById("dirtyCount");
  counter.textContent = "Unsaved changes: " + state.dirtyFields.size;
  counter.classList.toggle("has", state.dirtyFields.size > 0);
  document.getElementById("save").disabled = state.saving || state.dirtyFields.size === 0;
  document.getElementById("revert").disabled = state.saving;
}

function setStatus(lines) {
  const box = document.getElementById("saveStatus");
  clear(box);
  for (const line of lines) {
    box.appendChild(el("div", { class: "line " + line[0] }, line[1]));
  }
}

async function save() {
  if (state.saving) return;
  const tables = Array.from(state.dirtyTables).sort();
  if (!tables.length) {
    setStatus([["info", "nothing to save"]]);
    return;
  }
  state.saving = true;
  refreshDirty();
  const results = [];
  for (const table of tables) {
    setStatus(results.concat([["info", "saving masters_" + table + ".json ..."]]));
    try {
      const body = await fetchJSON("/api/table/" + table, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rows: state.data[table] })
      });
      if (!body || body.ok !== true) throw new Error("unexpected response");
      state.pristine[table] = JSON.parse(JSON.stringify(state.data[table]));
      results.push(["ok", "ok   wrote override masters_" + table + ".json (" + body.written + " rows)"]);
    } catch (error) {
      results.push(["err", "fail masters_" + table + ".json: " + error.message]);
    }
    setStatus(results);
  }
  state.saving = false;
  refreshDirty();
  if (!results.some(function (line) { return line[0] === "err"; })) {
    results.push(["info", "saved to the override dir - click \"Restart API to apply\" to load them"]);
  }
  await loadOverrides();
  await loadApplyStatus();
  renderPanel();
  setStatus(results);
}

async function revert() {
  if (state.saving) return;
  state.saving = true;
  setStatus([["info", "reloading the masters ..."]]);
  try {
    await loadEverything(true);
    await loadOverrides();
    buildScreens();
    state.inputs.clear();
    renderPanel();
    setStatus([["info", "masters reloaded"]]);
  } catch (error) {
    setStatus([["err", "reload failed: " + error.message]]);
  }
  state.saving = false;
  refreshDirty();
}

/* Restart the API so it re-reads the override files, then wait for the health probe. */
async function applyNow() {
  if (state.applying) return;
  const command = (state.apply && state.apply.applyCmd) || "docker restart deploy-api-1";
  const pending = (state.apply && state.apply.pending) || [];
  if (!window.confirm("Restart the API to load the saved overrides?\n\n" +
      "Live matches are dropped: players in a match disconnect or lose the battle state.\n\n" +
      (pending.length ? "Pending override(s): " + pending.join(", ") + "\n\n" : "") +
      "Command:\n" + command)) {
    return;
  }
  state.applying = true;
  renderApplyStatus();
  setStatus([["info", "restarting the API: " + command]]);
  try {
    const body = await fetchJSON("/api/apply", { method: "POST" });
    if (!body || body.ok !== true) throw new Error((body && body.error) || "apply failed");
    setStatus([
      ["ok", "API restarted and healthy after " + body.elapsedSeconds + "s (" +
        ((body.health && body.health.attempts) || 0) + " probe(s))"],
      ["info", (body.pending && body.pending.length)
        ? "still pending: " + body.pending.join(", ")
        : "no pending overrides: the API has loaded every override"],
    ]);
    state.apply = await fetchJSON("/api/apply", { cache: "no-store" });
  } catch (error) {
    setStatus([["err", "apply failed: " + error.message]]);
    try { state.apply = await fetchJSON("/api/apply", { cache: "no-store" }); } catch (ignored) { /* keep the old status */ }
  }
  state.applying = false;
  renderApplyStatus();
}

/* -------------------------------------------------------------------- boot */

function wireEvents() {
  const tabs = document.querySelectorAll("#tabs button");
  for (const button of tabs) {
    button.addEventListener("click", function () {
      state.tab = button.dataset.tab;
      for (const other of tabs) other.classList.toggle("on", other === button);
      document.getElementById("filters").style.display =
        state.tab === "maintenance" ? "none" : "flex";
      document.getElementById("discFilters").style.display =
        state.tab === "discs" ? "block" : "none";
      renderList();
      renderPanel();
      refreshDirty();
    });
  }
  document.getElementById("filterText").addEventListener("input", renderList);
  document.getElementById("filterRarity").addEventListener("change", renderList);
  document.getElementById("filterType").addEventListener("change", renderList);
  document.getElementById("save").addEventListener("click", save);
  document.getElementById("revert").addEventListener("click", revert);
  document.getElementById("apply").addEventListener("click", applyNow);
  document.getElementById("exportOverrides").addEventListener("click", function () {
    window.location.href = "/api/overrides/export";
  });
  window.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
      event.preventDefault();
      save();
    }
  });
}

async function boot() {
  wireEvents();
  try {
    const loaded = await Promise.all([
      fetchJSON("/api/kickers", { cache: "no-store" }),
      fetchJSON("/api/discs", { cache: "no-store" })
    ]);
    state.kickers = loaded[0];
    state.discs = loaded[1];
    await loadEverything(false);
    try { state.layout = await fetchJSON("/api/layout", { cache: "no-store" }); } catch (error) { state.layout = []; }
    try {
      const schema = await fetchJSON("/api/effect-schema", { cache: "no-store" });
      state.effectSchema = (schema && schema.tables) || {};
    } catch (error) { state.effectSchema = {}; }
    await loadOverrides();
    await loadApplyStatus();
    await loadMaintenance();
    buildScreens();
    buildDiscFilters();
    renderList();
    renderPanel();
    refreshDirty();
  } catch (error) {
    clear(document.getElementById("panel"));
    document.getElementById("panel").appendChild(el("p", { class: "empty" },
      "could not reach the balance server: " + error.message +
      " — start it with: python tools/balance/server.py"));
    setStatus([["err", "startup failed: " + error.message]]);
  }
}

boot();
</script>
</body>
