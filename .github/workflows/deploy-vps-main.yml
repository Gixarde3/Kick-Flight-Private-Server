name: Read VPS Photon diagnostics (read only)

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Start of the UTC log window (YYYY-MM-DDTHH:MM:SSZ)"
        required: true
        type: string
        default: "2026-10-05T02:45:00Z"
      until:
        description: "End of the UTC log window (YYYY-MM-DDTHH:MM:SSZ)"
        required: true
        type: string
        default: "2026-10-05T03:15:00Z"

permissions:
  contents: read

concurrency:
  group: kick-flight-vps-readonly-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    name: Read production Photon and matchmaking logs
    if: github.repository == 'gixakickflight/Kick-Flight-Private-Server' && github.ref == 'refs/heads/diag/vps-photon-logs-readonly'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Validate pinned SSH access and inspect runtime state
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          LOG_SINCE: ${{ inputs.since }}
          LOG_UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || {
            echo "Missing production SSH secret" >&2
            exit 1
          }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid VPS_HOST" >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid VPS_USER" >&2; exit 1; }
          [[ "$VPS_APP_DIR" == /* && "$VPS_APP_DIR" != *$'\n'* ]] || { echo "Invalid VPS_APP_DIR" >&2; exit 1; }
          [[ "$LOG_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "Invalid UTC start timestamp" >&2; exit 1;
          }
          [[ "$LOG_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
            echo "Invalid UTC end timestamp" >&2; exit 1;
          }
          since_epoch="$(date -u -d "$LOG_SINCE" +%s)"
          until_epoch="$(date -u -d "$LOG_UNTIL" +%s)"
          (( until_epoch > since_epoch && until_epoch - since_epoch <= 1800 )) || {
            echo "Log window must be positive and at most 30 minutes" >&2; exit 1;
          }

          key_file="$RUNNER_TEMP/kf-vps-readonly-key"
          hosts_file="$RUNNER_TEMP/kf-vps-readonly-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts_file"
          port="${VPS_SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid VPS_SSH_PORT" >&2; exit 1; }
          known_host="$VPS_HOST"
          if [[ "$port" != 22 ]]; then known_host="[$VPS_HOST]:$port"; fi
          ssh-keygen -F "$known_host" -f "$hosts_file" >/dev/null || {
            echo "Pinned known-host entry does not match VPS_HOST" >&2; exit 1;
          }

          printf -v q_app '%q' "$VPS_APP_DIR"
          printf -v q_since '%q' "$LOG_SINCE"
          printf -v q_until '%q' "$LOG_UNTIL"
          ssh -i "$key_file" -p "$port" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" \
            "$VPS_USER@$VPS_HOST" "bash -s -- $q_app $q_since $q_until" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          since="$2"
          until="$3"
          cd "$app_dir"
          compose=(docker compose --env-file "$app_dir/.env" --project-name deploy \
            -f "$app_dir/deploy/docker-compose.vps.external-db.yml")

          echo "UTC window: $since .. $until"
          echo "VPS clock: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for service in api grpc photon; do
            if ! container="$("${compose[@]}" ps -q "$service" 2>/dev/null)"; then
              echo "$service: compose status query failed"
              exit 1
            fi
            if [[ -n "$container" ]]; then
              if ! docker inspect --format '{{.Name}} status={{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}}' "$container" 2>/dev/null; then
                echo "$service: container status query failed"
                exit 1
              fi
            else
              echo "$service: no running container found"
            fi
          done

          if ! api="$("${compose[@]}" ps -q api 2>/dev/null)"; then
            echo "api: compose status query failed"
            exit 1
          fi
          if [[ -n "$api" ]]; then
            if ! docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$api" 2>/dev/null \
              | awk -F= '$1 == "KF_MATCH_WINDOW_SECONDS" { print "Effective " $1 "=" $2 }'; then
              echo "api: selected environment value query failed"
              exit 1
            fi
          fi
          if ! grpc="$("${compose[@]}" ps -q grpc 2>/dev/null)"; then
            echo "grpc: compose status query failed"
            exit 1
          fi
          if [[ -n "$grpc" ]]; then
            if ! nginx_config="$("${compose[@]}" exec -T grpc nginx -T 2>/dev/null)"; then
              echo "grpc: selected nginx config query failed"
              exit 1
            fi
            printf '%s\n' "$nginx_config" \
              | sed -n '/location = \/openmatch.Frontend\/GetAssignments/,/}/p' \
              | grep -E 'grpc_read_timeout' || true
          fi

          for service in photon api grpc; do
            echo "--- selected $service log lines ---"
            if ! "${compose[@]}" logs --no-color --timestamps --since "$since" --until "$until" "$service" 2>/dev/null \
              | awk '{ line = tolower($0) }
                line ~ /peer|game|battle-|room|master|join|leave|disconnect|timeout|connect|refused|reset|reliable|receive window|out.of.window|ack|stage[[:space:]123]|getassignments|matchmaking|roster|grpc|upstream|stream|expired|reject|closing|removed|stale|empty.room|error|warn|failed/ \
                && line !~ /auth.?data|auth.?token|authorization|bearer|password|secret|token|ticket|private.?key|database.?url|database.?password|connection.?string|connection.?url|dsn|credential|email|user.?id|user.?name|player.?name|nickname|device.?id|session.?id|uuid|guid/ { print }'; then
              echo "$service: selected log query failed"
              exit 1
            fi
          done
          REMOTE
